# Counts real downloads (installer and portable .exe files only, not latest.yml or
# .blockmap, which the app fetches when it checks for updates) and publishes the
# total as a shields.io endpoint badge on the `badges` branch.
name: Downloads badge

on:
  schedule:
    - cron: '0 */3 * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const total = releases
              .flatMap((r) => r.assets)
              .filter((a) => a.name.toLowerCase().endsWith('.exe'))
              .reduce((sum, a) => sum + a.download_count, 0);
            const message = total >= 1000 ? `${(total / 1000).toFixed(1).replace(/\.0$/, '')}k` : String(total);
            const badge = { schemaVersion: 1, label: 'downloads', message, color: '9cc2ff', labelColor: '08090d' };
            const content = Buffer.from(JSON.stringify(badge) + '\n').toString('base64');

            let sha;
            try {
              const { data } = await github.rest.repos.getContent({ owner, repo, path: 'downloads.json', ref: 'badges' });
              if (data.content.replace(/\n/g, '') === content) return core.info(`Unchanged: ${message}`);
              sha = data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, branch: 'badges', path: 'downloads.json', sha,
              message: `Downloads: ${message}`, content,
            });
            core.info(`Downloads: ${total}`);
